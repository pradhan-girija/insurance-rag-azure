name: Build Gradio UI Image

on:
  push:
    branches:
      - main

jobs:
  build-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Gradio UI Docker image
        run: |
          docker build -f Dockerfile.gradio -t ${{ secrets.ACR_LOGIN_SERVER }}/insurance-rag-ui:v1 .

      - name: Push Gradio UI Docker image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/insurance-rag-ui:v1

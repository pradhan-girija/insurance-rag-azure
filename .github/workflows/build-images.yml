name: Build and Push Images to ACR

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check ACR secrets are available
        run: |
          if [ -z "$ACR_LOGIN_SERVER" ]; then echo "ACR_LOGIN_SERVER is missing"; exit 1; fi
          if [ -z "$ACR_USERNAME" ]; then echo "ACR_USERNAME is missing"; exit 1; fi
          if [ -z "$ACR_PASSWORD" ]; then echo "ACR_PASSWORD is missing"; exit 1; fi
          echo "ACR secrets are available"
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build API image
        run: |
          docker build -f Dockerfile.api -t ${{ secrets.ACR_LOGIN_SERVER }}/insurance-rag-api:v1 .

      - name: Push API image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/insurance-rag-api:v1

      - name: Build Gradio UI image
        run: |
          docker build -f Dockerfile.gradio -t ${{ secrets.ACR_LOGIN_SERVER }}/insurance-rag-ui:v1 .

      - name: Push Gradio UI image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/insurance-rag-ui:v1
